<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRI NANDHI CARGO MOVERS</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f1f4f7;color:#183044}header{background:#12304a;color:white;padding:18px}main{padding:12px;max-width:900px;margin:auto}.card{background:white;padding:14px;border-radius:12px;margin:12px 0}h2{margin-top:0}label{display:block;margin:8px 0;font-size:14px}input{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd6df;border-radius:7px;margin-top:4px}button{padding:11px 14px;background:#12304a;color:white;border:0;border-radius:8px;margin:5px 4px 5px 0}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media print{header,.noprint{display:none}.card{box-shadow:none}}
</style></head><body>
<header><h2>SRI NANDHI CARGO MOVERS</h2>Digital Trip Book</header><main>
<section class="card noprint"><h2>தினசரி ட்ரிப் பதிவு</h2><form id="f"><div class="grid">
<label>தேதி<input id="date" type="date" required></label><label>வண்டி எண்<input id="vehicle" required></label>
<label>டிரைவர் பெயர்<input id="driver"></label><label>From<input id="from" required></label><label>To<input id="to" required></label>
<label>Rent ₹<input id="rent" type="number" value="0"></label><label>Diesel ₹<input id="diesel" type="number" value="0"></label>
<label>Bunk Credit ₹<input id="credit" type="number" value="0"></label><label>Salary ₹<input id="salary" type="number" value="0"></label>
<label>Advance ₹<input id="advance" type="number" value="0"></label><label>Toll ₹<input id="toll" type="number" value="0"></label><label>Other ₹<input id="other" type="number" value="0"></label>
<label>Start KM<input id="start" type="number"></label><label>End KM<input id="end" type="number"></label></div>
<button type="submit">Save Trip</button><button type="button" onclick="document.getElementById('f').reset()">Clear</button></form></section>
<section class="card"><h2>Trip Records</h2><div class="noprint"><button onclick="window.print()">PDF / Print</button><button onclick="backup()">Backup JSON</button></div><div id="totals"></div><div class="scroll"><table><thead><tr><th>Date</th><th>Vehicle</th><th>Driver</th><th>From-To</th><th>Rent</th><th>Diesel</th><th>Credit</th><th>Salary</th><th>Advance</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const keys=['date','vehicle','driver','from','to','rent','diesel','credit','salary','advance','toll','other','start','end'];
let data=JSON.parse(localStorage.getItem('sncmTrips')||'[]');
date.value=new Date().toISOString().slice(0,10);
f.onsubmit=e=>{e.preventDefault();let x={};keys.forEach(k=>x[k]=document.getElementById(k).value);data.push(x);localStorage.setItem('sncmTrips',JSON.stringify(data));f.reset();date.value=new Date().toISOString().slice(0,10);render()};
function render(){rows.innerHTML=data.map(x=>`<tr><td>${x.date}</td><td>${x.vehicle}</td><td>${x.driver}</td><td>${x.from}-${x.to}</td><td>${x.rent}</td><td>${x.diesel}</td><td>${x.credit}</td><td>${x.salary}</td><td>${x.advance}</td></tr>`).join('');let s=k=>data.reduce((a,x)=>a+(+x[k]||0),0);totals.innerHTML=`Trips: ${data.length} | Rent: ₹${s('rent')} | Diesel: ₹${s('diesel')} | Bunk Credit: ₹${s('credit')} | Salary: ₹${s('salary')} | Advance: ₹${s('advance')}`;}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sri-nandhi-trip-backup.json';a.click()}render();
</script></body></html>
